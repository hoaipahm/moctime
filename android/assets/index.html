.eq i:nth-child(1){height:5px;animation-delay:0s}.eq i:nth-child(2){height:12px;animation-delay:.18s}.eq i:nth-child(3){height:8px;animation-delay:.34s}

.col{display:none}

.m-icbtn{cursor:pointer;display:inline-flex;align-items:center;gap:5px;background:var(--field);color:var(--ink);border:2.5px solid var(--line);border-radius:10px;padding:6px 9px;font:700 12.5px/1 'Space Grotesk',sans-serif;box-shadow:2px 2px 0 var(--line)}
.m-icbtn:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}

.wide{grid-column:auto}.day{min-height:52px}.day i{font-size:10px;opacity:.75}.hero-me{grid-template-columns:auto 1fr}.hero-me .hero-act{grid-column:1/-1}

.btn{min-height:40px}

}

else if(kind=='menu'){pluck(440,.1,v*.55,'sine',0);pluck(587.33,.13,v*.6,'triangle',.04)}

function tt1(t){if(EN.hasOwnProperty(t))return EN[t];for(const[re,to]of RX)if(re.test(t))return t.replace(re,to);for(const sp of[' · ',' – '])if(t.includes(sp))return t.split(sp).map(tt1).join(sp);if(t.startsWith('★ '))return '★ '+tt1(t.slice(2));return t}

function tr(root){if(lang!='en'||!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];let n;while(n=w.nextNode())if(!/^(SCRIPT|STYLE|TEXTAREA)$/.test(n.parentNode.nodeName))L.push(n);L.forEach(n=>{const v=TX(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});root.querySelectorAll('[placeholder],[aria-label],[title]').forEach(e=>['placeholder','aria-label','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const x=TX(v);if(x!==v)e.setAttribute(a,x)}}))}

const VD=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value');
function field(kind,init,cls){const isD=kind=='date',t=document.createElement('input');t.type='text';t.inputMode='numeric';t.autocomplete='off';t.className=cls||'';t.maxLength=isD?10:5;t.style.width=isD?'150px':'90px';t.placeholder=isD?(lang=='en'?'dd/mm/yyyy':'ngày/tháng/năm'):'HH:MM';const show=v=>{if(!v)return '';if(isD){const[y,m,d]=v.split('-');return d+'/'+m+'/'+y}return v};VD.set.call(t,show(init));
Object.defineProperty(t,'value',{get(){const s=VD.get.call(t);if(isD){const m=s.match(/^(\d\d)\/(\d\d)\/(\d{4})$/);if(!m)return '';const x=new Date(+m[3],m[2]-1,+m[1]);return x.getDate()==+m[1]&&x.getMonth()==m[2]-1&&+m[3]>=1000?m[3]+'-'+m[2]+'-'+m[1]:''}const m=s.match(/^(\d\d):(\d\d)$/);return m&&+m[1]<24&&+m[2]<60?s:''},set(v){VD.set.call(t,show(v))}});
t.addEventListener('input',()=>{let s=VD.get.call(t).replace(/\D/g,'');if(isD){s=s.slice(0,8);if(s.length>4)s=s.slice(0,2)+'/'+s.slice(2,4)+'/'+s.slice(4);else if(s.length>2)s=s.slice(0,2)+'/'+s.slice(2)}else{s=s.slice(0,4);if(s.length>2)s=s.slice(0,2)+':'+s.slice(2)}VD.set.call(t,s)});return t}
function dfix(root){root.querySelectorAll('input[type=date],input[type=time]').forEach(e=>{const t=field(e.type,e.value,e.className);t.id=e.id;e.replaceWith(t)});root.querySelectorAll('input[type=datetime-local]').forEach(e=>{const s=document.createElement('span'),a=field('date',''),b=field('time','');s.id=e.id;s.style.cssText='display:inline-flex;gap:6px';s.append(a,b);Object.defineProperty(s,'value',{get(){return a.value&&b.value?a.value+'T'+b.value:''}});e.replaceWith(s)})}
